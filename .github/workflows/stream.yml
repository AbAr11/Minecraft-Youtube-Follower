name: Minecraft Spectator Stream
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Mineflayer and FFmpeg Tools
        run: |
          npm install mineflayer
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Launch Free Stream Canvas & Bot
        run: |
          # 1. Start a fake virtual screen in the cloud data center
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 2

          # 2. DIRECT YOUTUBE LINK OVERRIDE (Erased the secret vault token completely)
          ffmpeg -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 -f lavfi -i testsrc=size=1280x720:rate=30 -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -f flv "puz3-t3d2-5dxu-k0a4-f9m7" &

          # 3. Start the tracking bot with network KeepAlive handling
          node -e "
          const mineflayer = require('mineflayer');
          const bot = mineflayer.createBot({
            host: '${{ secrets.SERVER_HOST }}',
            port: parseInt('${{ secrets.SERVER_PORT }}'),
            username: 'StreamCam',
            version: '1.21.4' // Matches your exact server configuration!
          });

          bot.on('login', () => {
            console.log('Handshake passed! Authenticating password...');
            bot.chat('/register BotPassword123 BotPassword123');
            bot.chat('/login BotPassword123');
          });

          bot.on('spawn', () => {
            console.log('StreamCam has established a permanent live connection!');
            
            // Core coordinate teleportation tracking link
            setInterval(() => {
              bot.chat('/tp StreamCam ${{ secrets.TARGET_PLAYER }}');
            }, 1000);

            // NETWORK KEEP-ALIVE: Tells HidenCloud the bot is alive so it never times out
            setInterval(() => {
              bot.swingArm('right');
            }, 4000);
          });

          bot.on('kicked', (reason) => console.log('Kicked from server: ', reason));
          bot.on('error', (err) => console.log('Network Error Handler: ', err));
          "
